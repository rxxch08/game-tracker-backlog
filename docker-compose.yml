services:
  db:
    image: postgres:16-alpine
    container_name: backlog-clear-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backlog}
      POSTGRES_DB: ${POSTGRES_DB:-backlog_clear}
    ports:
      # Host port 5433 avoids clashing with a Postgres already using 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder only run on the first startup of an empty volume
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backlog} -d ${POSTGRES_DB:-backlog_clear}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    container_name: backlog-clear-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      # Inside Docker, the database is reachable through the service name
      DATABASE_URL: postgres://${POSTGRES_USER:-backlog}:${POSTGRES_PASSWORD:-backlog}@db:5432/${POSTGRES_DB:-backlog_clear}
    ports:
      - "4000:4000"

volumes:
  pgdata:
